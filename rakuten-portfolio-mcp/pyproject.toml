[project]
name = "rakuten-portfolio-mcp"
version = "0.1.0"
description = "楽天証券の保有商品CSVを読んでポートフォリオと信用建玉を分析するMCPサーバー"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "mcp>=1.2.0",
    "pyyaml>=6.0",
]

[project.scripts]
rakuten-portfolio-mcp = "rakuten_portfolio_mcp.server:main"
rakuten-portfolio = "rakuten_portfolio_mcp.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rakuten_portfolio_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
