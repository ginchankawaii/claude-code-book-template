[project]
name = "voice-logger"
version = "0.1.0"
description = "ローカル完結型・音声ライフログパイプライン (Phase 0)"
requires-python = ">=3.11"
dependencies = [
    "faster-whisper>=1.0.0",
    "requests>=2.31.0",
]

[project.scripts]
voice-logger = "voice_logger.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/voice_logger"]

[tool.pytest.ini_options]
# `cd voice-logger && python -m pytest` を PYTHONPATH 無しで通すため（src レイアウト）
pythonpath = ["src"]
testpaths = ["tests"]
