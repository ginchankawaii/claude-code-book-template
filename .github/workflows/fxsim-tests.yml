# Runs the fxsim test suite and the research-harness validations.
# Until Round-10 the only check on this repository was a code-review job: no
# push ever ran a test. This installs fxsim/requirements.txt with
# fxsim/constraints.txt exactly as the Docker image does (same Python, every
# package pinned), so what the owner rebuilds is what was tested here. Pushes
# to the claude/** work branches run it too: the owner pulls from one, and a
# test that runs only while a pull request is open can be skipped (Round-10B).
name: fxsim tests

on:
  pull_request:
    paths:
      - "fxsim/**"
      - ".github/workflows/fxsim-tests.yml"
  push:
    branches: [main, "claude/**"]
    paths:
      - "fxsim/**"
      - ".github/workflows/fxsim-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: fxsim
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"          # the Dockerfile's interpreter
          cache: pip
          cache-dependency-path: |
            fxsim/requirements.txt
            fxsim/constraints.txt
      - name: Install the pinned dependencies
        run: pip install -r requirements.txt -c constraints.txt
      - name: Every pinned package is installed at its pinned version
        run: |
          pip freeze | sort > /tmp/installed.txt
          grep -v '^#' constraints.txt | sort > /tmp/pinned.txt
          missing=$(comm -23 /tmp/pinned.txt /tmp/installed.txt)
          if [ -n "$missing" ]; then echo "not installed as pinned:"; echo "$missing"; exit 1; fi
      - name: Test suite
        run: python -m pytest tests -q
      - name: Research harness reproduces the engine (14 OK lines)
        run: python -m scripts.research_harness
      - name: Daily port reproduces the harness (4 OK lines)
        run: python -m scripts.research_daily_port
