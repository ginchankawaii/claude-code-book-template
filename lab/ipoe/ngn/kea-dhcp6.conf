// NGN-SIM: PD 方式 (ひかり電話あり相当) の DHCPv6 設定
// Kea は # / // / /* */ コメントを許容するので、注記は独自キーではなくコメントで書く
// (独自キー "_comment" 等は Kea 2.x の厳格パーサに unknown_map_entry で弾かれる)
//
// 構文確認:  kea-dhcp6 -t /etc/kea/kea-dhcp6.conf
{
  "Dhcp6": {
    "interfaces-config": { "interfaces": [ "eth1" ] },
    "lease-database": { "type": "memfile", "persist": true },

    // IA_PD リース時に委譲プレフィックスの復路経路を自動投入する (kea-pd-route.sh)
    // setup-ngn.sh が AppArmor 許可と CAP_NET_ADMIN 付与も同時に行う (両方ないと動かない)
    // ライブラリのパスが違う場合:  dpkg -L kea-common | grep run_script
    "hooks-libraries": [
      {
        "library": "/usr/lib/x86_64-linux-gnu/kea/hooks/libdhcp_run_script.so",
        "parameters": { "name": "/usr/local/sbin/kea-pd-route.sh", "sync": false }
      }
    ],

    // ---- 実網 NGN の癖 (DUID-LL 以外を無応答で破棄) を再現したい場合 ----
    // **実測(サイクル 5): OpenWrt は DUID-LL(0x0003)を送るので、この DROP を素通りします。**
    // OpenWrt を CE にしている限り罠として機能しません。DUID-LLT を送る CPE を使うか、
    // デモ用にテストを反転(0x0003 を落とす)してください。
    //
    // 既定では無効にしてある。当初の理由: CPE は既定で DUID-LLT を送るため、
    // 最初の疎通確認の段階でこれを有効にすると「PD が取れない」原因の切り分けが
    // 難しくなる。ラボが一度通ったあと、意図的なトラップとして有効化すること。
    //
    // 有効化する手順: 下の 3 行のコメントを外す (subnet6 側の変更は不要)
    //   "client-classes": [
    //     { "name": "DROP", "test": "not (substring(option[1].hex, 0, 2) == 0x0003)" }
    //   ],
    //
    // Kea 特殊クラス DROP はパケットを黙って破棄するので、実網同様の「無応答」になる。
    // (subnet の client-class ガードだと NoPrefixAvail を返してしまい無応答にならない)

    "subnet6": [
      {
        "id": 1,
        "subnet": "2001:db8:1000::/40",
        "interface": "eth1",

        // テスト CE 1 台向けに /56 を 1 本だけ委譲する。
        // MAP-E の期待値 (共有IPv4=198.51.100.10 / PSID=5) を固定するため意図的に単一
        "pd-pools": [
          {
            "prefix": "2001:db8:100a:500::",
            "prefix-len": 56,
            "delegated-len": 56
          }
        ],

        // 実機を複数台つなぐ場合は、ここに DUID ベースの予約を書くと
        // 機種ごとに固定プレフィックスを配れる。
        // DUID は次で確認する:  tcpdump -ni <ACCESS_IF> udp port 547
        // 予約範囲は上の pd-pools と重ならないようにすること。記述例:
        //   { "duid": "00:03:00:01:aa:bb:cc:dd:ee:01", "prefixes": [ "2001:db8:100b:100::/56" ] },
        //   { "duid": "00:03:00:01:aa:bb:cc:dd:ee:02", "prefixes": [ "2001:db8:100c:200::/56" ] }
        // 注意1: MAP-E / DS-Lite は BR/AFTR が静的トンネルのため同時 1 CE のみ。
        //        複数台に配れるのは IPv6 (native / PD) までで、v4 over v6 は 1 台ずつ。
        // 注意2: 予約プレフィックスも MAP ルール (2001:db8:1000::/40) の内側にあるため、
        //        MAP-E を自動計算する CE に配ると BR の静的設定と食い違う共有IPv4/PSID を
        //        自己計算して「IPv6 は動くのに v4 だけ死ぬ」を招く。IPv6 検証専用に使うか、
        //        CE 側で v4 over v6 を無効にしてから使うこと。
        "reservations": [
        ],

        "option-data": [
          { "name": "dns-servers", "data": "2001:db8:cafe::53" }
        ]
      }
    ],

    // output_options はアンダースコア表記が正 (Kea 2.4 系はハイフン形を受け付けない)。
    // 出力先は /var/log/kea/ 配下でなければならない
    // (systemd unit が User=_kea + LogsDirectory=kea、AppArmor も同ディレクトリのみ許可)
    "loggers": [
      { "name": "kea-dhcp6", "severity": "INFO",
        "output_options": [ { "output": "/var/log/kea/kea-dhcp6.log" } ] }
    ]
  }
}
