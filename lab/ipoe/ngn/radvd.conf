# NGN-SIM: アクセス網向け RA 設定
# ra モード(ひかり電話なし相当): このファイルをそのまま使用 (/64 を A フラグで配布)
# pd モード(ひかり電話あり相当): setup-ngn.sh が prefix ブロックを削り
#   M/O フラグのみの RA(デフォルト経路広報 + DHCPv6 誘導)に書き換える

interface eth1
{
    AdvSendAdvert on;
    MaxRtrAdvInterval 30;
    AdvManagedFlag off;
    AdvOtherConfigFlag on;
    AdvLinkMTU 1500;

    # RA方式の/64。MAPルール(2001:db8:1000::/40, ea-len16)のEA bits(bit40-55)が
    # 有意になる値にしてある: 0x14,0x03 → 共有IPv4=198.51.100.20, PSID=3
    prefix 2001:db8:1014:300::/64
    {
        AdvOnLink on;
        AdvAutonomous on;
    };

    RDNSS 2001:db8:cafe::53
    {
    };
};
