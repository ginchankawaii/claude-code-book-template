{
  "_comment": "RA モード用: 実網 NGN (ひかり電話なし) 同様、アドレスも PD も配らず Information-Request に DNS だけ返すステートレス DHCPv6。RDNSS 非対応 CPE の名前解決検証に必要",
  "Dhcp6": {
    "interfaces-config": { "interfaces": [ "eth1" ] },
    "subnet6": [
      {
        "id": 1,
        "subnet": "2001:db8:1014:300::/64",
        "interface": "eth1",
        "option-data": [
          { "name": "dns-servers", "data": "2001:db8:cafe::53" }
        ]
      }
    ],
    "loggers": [
      { "name": "kea-dhcp6", "severity": "INFO",
        "output-options": [ { "output": "/var/log/kea-dhcp6.log" } ] }
    ]
  }
}
