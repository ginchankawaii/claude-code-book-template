// NGN-SIM: RA モード用 (ひかり電話なし相当) のステートレス DHCPv6
// 実網 NGN 同様、アドレスも PD も配らず Information-Request に DNS だけ返す。
// RDNSS 非対応の CPE でも名前解決できるかを検証するために必要
// (注記は独自キーではなくコメントで書く: "_comment" 等は Kea に弾かれる)
{
  "Dhcp6": {
    "interfaces-config": { "interfaces": [ "eth1" ] },
    "subnet6": [
      {
        "id": 1,
        "subnet": "2001:db8:1014:300::/64",
        "interface": "eth1",
        "option-data": [
          { "name": "dns-servers", "data": "2001:db8:cafe::53" }
        ]
      }
    ],
    "loggers": [
      { "name": "kea-dhcp6", "severity": "INFO",
        "output-options": [ { "output": "/var/log/kea-dhcp6.log" } ] }
    ]
  }
}
