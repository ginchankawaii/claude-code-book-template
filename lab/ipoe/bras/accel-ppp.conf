[modules]
log_file
pppoe
auth_pap
auth_chap_md5
ippool

[core]
log-error=/var/log/accel-ppp/core.log
thread-count=2

[common]
# 実網ISP同様、同一ユーザの二重セッションを拒否する (セッション残留トラブルR2の再現に必須)
single-session=deny

[log]
log-file=/var/log/accel-ppp/accel-ppp.log
level=3

[ppp]
verbose=1
min-mtu=1280
mtu=1454
mru=1454
ipv4=require
ipv6=deny
lcp-echo-interval=20
lcp-echo-failure=3

[pppoe]
interface=eth1
ac-name=LAB-BRAS
service-name=lab-isp

[auth]
any-login=0

[chap-secrets]
chap-secrets=/etc/ppp/chap-secrets
gw-ip-address=100.64.0.1

[ip-pool]
gw-ip-address=100.64.0.1
# 動的プールは /25 に限定 (chap-secrets の固定IP 100.64.1.200 は .128 以降から採り、重複を防ぐ)
100.64.1.0/25

[dns]
dns1=203.0.113.53

[cli]
telnet=127.0.0.1:2000
# accel-cmd の既定接続先はポート 2001 (telnet CLI とは別プロトコル)
tcp=127.0.0.1:2001
