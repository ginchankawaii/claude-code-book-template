<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 780" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',Meiryo,sans-serif">
  <!-- 背景 -->
  <rect x="0" y="0" width="1000" height="780" fill="#ffffff"/>

  <!-- タイトル -->
  <text x="40" y="48" font-size="26" font-weight="bold" fill="#1a1a1a">MindClip DIY 配線図（v1）</text>
  <text x="40" y="74" font-size="14" fill="#555555">XIAO ESP32S3 Sense ＋ LiPo電池 ＋ スライドスイッチ ＋ 録音中LED</text>

  <!-- 凡例 -->
  <g>
    <rect x="690" y="30" width="270" height="130" rx="8" fill="#fafafa" stroke="#bbbbbb"/>
    <text x="705" y="55" font-size="14" font-weight="bold" fill="#1a1a1a">凡例（線色）</text>
    <line x1="705" y1="75" x2="745" y2="75" stroke="#d62828" stroke-width="4"/>
    <text x="755" y="80" font-size="13" fill="#1a1a1a">電源＋（BAT+）</text>
    <line x1="705" y1="100" x2="745" y2="100" stroke="#1a1a1a" stroke-width="4"/>
    <text x="755" y="105" font-size="13" fill="#1a1a1a">GND（BAT−・共通GND）</text>
    <line x1="705" y1="125" x2="745" y2="125" stroke="#1565c0" stroke-width="4"/>
    <text x="755" y="130" font-size="13" fill="#1a1a1a">スイッチ信号（D1 / GPIO2）</text>
    <line x1="705" y1="150" x2="745" y2="150" stroke="#e07b00" stroke-width="4"/>
    <text x="755" y="155" font-size="13" fill="#1a1a1a">LED信号（D3 / GPIO4）</text>
  </g>

  <!-- ===== 配線（部品の下層に描画） ===== -->
  <!-- 青: D1 -> スイッチ中央端子 -->
  <path d="M400,230 H180 V226" fill="none" stroke="#1565c0" stroke-width="3"/>
  <!-- 橙: D3 -> 抵抗 -> LEDアノード -->
  <path d="M400,300 H372 V345 H352" fill="none" stroke="#e07b00" stroke-width="3"/>
  <path d="M292,345 H242" fill="none" stroke="#e07b00" stroke-width="3"/>
  <!-- 黒: 共通GNDバス GNDピン -> 下回り -> LEDカソード/スイッチ端端子 -->
  <path d="M600,230 H660 V720 H145 V226" fill="none" stroke="#1a1a1a" stroke-width="3"/>
  <path d="M214,345 H145" fill="none" stroke="#1a1a1a" stroke-width="3"/>
  <circle cx="145" cy="345" r="5" fill="#1a1a1a"/>
  <!-- 赤/黒: 電池 -->
  <path d="M470,428 V560" fill="none" stroke="#d62828" stroke-width="3"/>
  <path d="M530,428 V560" fill="none" stroke="#1a1a1a" stroke-width="3"/>

  <!-- ===== XIAO 基板 ===== -->
  <!-- USB-C -->
  <rect x="455" y="120" width="90" height="34" rx="10" fill="#cfd8dc" stroke="#546e7a" stroke-width="1.5"/>
  <text x="500" y="112" font-size="12" text-anchor="middle" fill="#546e7a">USB-C（充電・書き込み）</text>
  <!-- 基板本体 -->
  <rect x="400" y="150" width="200" height="290" rx="12" fill="#eef3f8" stroke="#37474f" stroke-width="2"/>
  <text x="500" y="185" font-size="15" font-weight="bold" text-anchor="middle" fill="#263238">XIAO ESP32S3 Sense</text>
  <!-- チップ -->
  <rect x="460" y="240" width="80" height="60" fill="#b0bec5" stroke="#78909c"/>
  <text x="500" y="275" font-size="11" text-anchor="middle" fill="#37474f">ESP32-S3</text>

  <!-- 左列ピン -->
  <g font-size="12" fill="#263238">
    <circle cx="400" cy="195" r="6" fill="#e0e0e0" stroke="#78909c"/><text x="414" y="199">D0</text>
    <circle cx="400" cy="230" r="6" fill="#1565c0" stroke="#0d47a1"/><text x="414" y="234" font-weight="bold">D1 (GPIO2)</text>
    <circle cx="400" cy="265" r="6" fill="#e0e0e0" stroke="#78909c"/><text x="414" y="269">D2</text>
    <circle cx="400" cy="300" r="6" fill="#e07b00" stroke="#b35c00"/><text x="414" y="304" font-weight="bold">D3 (GPIO4)</text>
    <circle cx="400" cy="335" r="6" fill="#e0e0e0" stroke="#78909c"/><text x="414" y="339">D4</text>
    <circle cx="400" cy="370" r="6" fill="#e0e0e0" stroke="#78909c"/><text x="414" y="374">D5</text>
    <circle cx="400" cy="405" r="6" fill="#e0e0e0" stroke="#78909c"/><text x="414" y="409">D6</text>
  </g>
  <!-- 右列ピン -->
  <g font-size="12" fill="#263238" text-anchor="end">
    <circle cx="600" cy="195" r="6" fill="#e0e0e0" stroke="#78909c"/><text x="586" y="199">5V</text>
    <circle cx="600" cy="230" r="6" fill="#1a1a1a" stroke="#000000"/><text x="586" y="234" font-weight="bold">GND</text>
    <circle cx="600" cy="265" r="6" fill="#e0e0e0" stroke="#78909c"/><text x="586" y="269">3V3</text>
    <circle cx="600" cy="300" r="6" fill="#e0e0e0" stroke="#78909c"/><text x="586" y="304">D10</text>
    <circle cx="600" cy="335" r="6" fill="#e0e0e0" stroke="#78909c"/><text x="586" y="339">D9</text>
    <circle cx="600" cy="370" r="6" fill="#e0e0e0" stroke="#78909c"/><text x="586" y="374">D8</text>
    <circle cx="600" cy="405" r="6" fill="#e0e0e0" stroke="#78909c"/><text x="586" y="409">D7</text>
  </g>

  <!-- BATパッド（裏面） -->
  <circle cx="470" cy="420" r="8" fill="#ffcdd2" stroke="#d62828" stroke-width="2" stroke-dasharray="3,2"/>
  <circle cx="530" cy="420" r="8" fill="#e0e0e0" stroke="#1a1a1a" stroke-width="2" stroke-dasharray="3,2"/>
  <text x="456" y="462" font-size="12" font-weight="bold" fill="#d62828" text-anchor="end">BAT+</text>
  <text x="544" y="462" font-size="12" font-weight="bold" fill="#1a1a1a">BAT−</text>
  <text x="396" y="490" font-size="11" fill="#777777" text-anchor="end">※BAT+ / BAT− は基板裏面のはんだパッド</text>
  <text x="396" y="506" font-size="11" font-weight="bold" fill="#c62828" text-anchor="end">※パッドの向き（Seeed公式wiki）: −はUSB-Cコネクタに</text>
  <text x="396" y="520" font-size="11" font-weight="bold" fill="#c62828" text-anchor="end">　近い側 / ＋は遠い側。はんだ付け前に必ず確認</text>
  <text x="396" y="536" font-size="11" fill="#777777" text-anchor="end">※Sense拡張ボードは部品面（USB-C側）にB2B装着（配線不要）。</text>
  <text x="396" y="550" font-size="11" fill="#777777" text-anchor="end">　BAT+/−パッドのある側が裏面</text>

  <!-- ===== スライドスイッチ ===== -->
  <rect x="110" y="150" width="140" height="65" rx="8" fill="#f5f5f5" stroke="#616161" stroke-width="2"/>
  <rect x="150" y="163" width="60" height="16" rx="3" fill="#bdbdbd" stroke="#757575"/>
  <rect x="153" y="165" width="24" height="12" rx="2" fill="#616161"/>
  <text x="180" y="200" font-size="13" text-anchor="middle" fill="#1a1a1a" font-weight="bold">スライドスイッチ</text>
  <text x="180" y="211" font-size="10" text-anchor="middle" fill="#616161">SS-12D00</text>
  <circle cx="145" cy="222" r="5" fill="#1a1a1a"/>
  <circle cx="180" cy="222" r="5" fill="#1565c0"/>
  <circle cx="215" cy="222" r="5" fill="#e0e0e0" stroke="#9e9e9e"/>
  <text x="145" y="244" font-size="10" text-anchor="middle" fill="#1a1a1a">端</text>
  <text x="180" y="244" font-size="10" text-anchor="middle" fill="#1565c0">中央</text>
  <text x="215" y="244" font-size="10" text-anchor="middle" fill="#9e9e9e">未使用</text>
  <text x="110" y="130" font-size="12" fill="#555555">録音 ON/OFF：ON＝GPIO2をGNDへ（内部プルアップ）</text>
  <text x="110" y="146" font-size="12" fill="#555555">deep sleep制御用。電源は切らない（充電可能を維持）</text>

  <!-- ===== LED + 抵抗 ===== -->
  <!-- 抵抗 -->
  <rect x="292" y="336" width="60" height="18" rx="4" fill="#ffe0b2" stroke="#e07b00" stroke-width="2"/>
  <text x="322" y="330" font-size="12" text-anchor="middle" fill="#b35c00" font-weight="bold">220Ω</text>
  <!-- LED -->
  <circle cx="228" cy="345" r="14" fill="#ff8a80" stroke="#d62828" stroke-width="2"/>
  <circle cx="228" cy="345" r="6" fill="#ffcdd2"/>
  <text x="243" y="372" font-size="11" fill="#d62828">A（長い足）</text>
  <text x="196" y="372" font-size="11" fill="#1a1a1a" text-anchor="end">K</text>
  <text x="228" y="392" font-size="12" text-anchor="middle" fill="#555555">3mm 赤色LED（録音中・筐体正面）</text>
  <text x="228" y="408" font-size="11" text-anchor="middle" fill="#888888">微灯はファームのPWMで調整</text>

  <!-- ===== 電池 ===== -->
  <rect x="420" y="560" width="200" height="95" rx="10" fill="#fff8e1" stroke="#8d6e63" stroke-width="2"/>
  <text x="520" y="595" font-size="14" text-anchor="middle" font-weight="bold" fill="#4e342e">LiPo 502530</text>
  <text x="520" y="615" font-size="12" text-anchor="middle" fill="#4e342e">3.7V 500mAh 保護回路付き</text>
  <text x="520" y="633" font-size="11" text-anchor="middle" fill="#8d6e63">30 × 25 × 5.0 mm</text>
  <text x="470" y="580" font-size="15" font-weight="bold" fill="#d62828" text-anchor="middle">＋</text>
  <text x="530" y="580" font-size="15" font-weight="bold" fill="#1a1a1a" text-anchor="middle">−</text>
  <text x="420" y="678" font-size="12" fill="#c62828">⚠ リード線の極性は接続前にテスターで確認（色が逆の個体あり）</text>

  <!-- ===== 注意書き ===== -->
  <g>
    <rect x="700" y="500" width="270" height="200" rx="8" fill="#f6f9ff" stroke="#90a4ae"/>
    <text x="715" y="527" font-size="13" font-weight="bold" fill="#263238">配線メモ</text>
    <text x="715" y="551" font-size="11.5" fill="#37474f">・GNDはXIAOのGNDピン1点に集約し、</text>
    <text x="715" y="567" font-size="11.5" fill="#37474f">　スイッチとLEDカソードへ分岐（●印）</text>
    <text x="715" y="591" font-size="11.5" fill="#37474f">・PDMマイクとmicroSDはSense拡張</text>
    <text x="715" y="607" font-size="11.5" fill="#37474f">　ボード内部接続のため配線不要</text>
    <text x="715" y="631" font-size="11.5" fill="#37474f">・はんだ付けは電池を最後に。先に</text>
    <text x="715" y="647" font-size="11.5" fill="#37474f">　USB給電で動作確認する</text>
    <text x="715" y="671" font-size="11.5" fill="#37474f">・はんだ部は熱収縮チューブと</text>
    <text x="715" y="687" font-size="11.5" fill="#37474f">　カプトンテープで絶縁</text>
  </g>
</svg>
