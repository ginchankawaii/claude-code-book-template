<text class="t" x="422" y="40">案D: 左デッドスペース搭載ユニバーサル基板</text>
<text x="422" y="60">variant = allday</text>
<text x="422" y="74">内寸 34.8 x 46.2 x 11.2 mm</text>
<text x="422" y="88">外形 38.0 x 49.4 x 14.6 mm</text>
<text x="422" y="102"></text>
<text x="422" y="116">基板: 秋月 112019 (1.0mm厚) を</text>
<text x="422" y="130">      10.2 x 15.9 mm (4x6=24穴) に切断</text>
<text x="422" y="144">      z 2.4..3.4 (床から 0.8mm 浮かせ)</text>
<text x="422" y="158"></text>
<text x="422" y="172">橙 J1 = JST PH 2P サイド型 (電池)</text>
<text x="422" y="186">緑 R1-R4 = 220k 分圧 x2組 / C1 = 0.1uF</text>
<text x="422" y="200">紫 W: = XIAO への配線ランド</text>
<text x="422" y="214"></text>
<text x="422" y="228">XIAO スタックの z には一切かからない</text>
<text x="422" y="242">  → 高さ予算への影響 0.0 mm</text>
<text x="422" y="256">  → 筐体CADの変更なし (allday)</text>
<text x="422" y="270"></text>
<text x="422" y="284">灰 = 既存の内部リブ (CADから読込)</text>
<text x="422" y="298">赤 LED はリッドから 4mm 侵入するため</text>
<text x="422" y="312">  その真下は部品高さが制限される</text>
