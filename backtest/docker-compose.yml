services:
  # 疎通確認だけを行う使い捨てコンテナ。
  # 標準ライブラリしか使わないので、イメージのビルドが要らない。
  # ホストに Python を一切入れずに実行できる。
  probe:
    image: python:3.12-slim
    env_file:
      - .env
    volumes:
      - .:/app
    working_dir: /app
    command: ["python", "probe_standalone.py"]

  erb:
    build: .
    image: erb:latest
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./results:/app/results
      - ./config.yaml:/app/config.yaml:ro
    working_dir: /app
